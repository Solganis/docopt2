name: Fuzz

# Coverage-guided fuzzing of the public API with atheris, off the PR path. The invariant is the one
# tests/test_robustness.py states and Hypothesis checks on grammar-shaped input: no entry point may raise
# anything but DocoptExit / DocoptLanguageError for any input. The Nightly job explores well-formed usage
# with Hypothesis; this reaches the malformed byte shapes it cannot, under coverage feedback, and a
# per-input -timeout turns a runaway (a pathological slowdown or an outright hang) into a finding. Unlike
# Mutation (report-only), a crash or timeout here is a real bug: the job fails and uploads the reproducer,
# which becomes a committed regression test.
#
# Linux only: atheris ships no Windows wheel. Pinned to Python 3.12, which has a prebuilt manylinux wheel.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the corpus of the last run is an artifact of it

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # An artifact and not a cache: a cache is evicted after seven days unread, and this job comes back on the eighth.
      - name: Start from the corpus of the last run
        continue-on-error: true # the first run has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fuzz.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$last" --repo "$GITHUB_REPOSITORY" --name fuzz-corpus --dir corpus

      # shell: bash turns pipefail on, so a finding fails the step through the tee.
      - name: Fuzz the public API for ten minutes
        shell: bash
        run: |
          mkdir -p fuzz-findings corpus
          cp fuzz/corpus/* corpus/
          uv run --locked --no-dev --python 3.12 --with atheris \
            python fuzz/fuzz_docopt.py corpus -dict=fuzz/docopt.dict -max_len=512 \
            -max_total_time=600 -timeout=30 -rss_limit_mb=4096 -artifact_prefix=fuzz-findings/ \
            2>&1 | tee fuzz.log

      # Run with no dictionary, this job covered 76 edges a week and was green: no input ever spelled "usage:".
      - name: Hold the run to a coverage floor
        run: |
          covered=$(grep -oE 'DONE +cov: [0-9]+' fuzz.log | grep -oE '[0-9]+$')
          echo "edges covered: ${covered:-none}"
          test "${covered:-0}" -ge 1000

      # Whole: libFuzzer writes an input only where it covers something new, and its -merge does not run under atheris.
      - name: Upload the corpus for the next run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: corpus/

      - name: Upload any crash or timeout reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: fuzz-findings/
          if-no-files-found: ignore
